[project]
name = "zebraformer"
version = "0.1.0"
description = "A minimal implementation of Transformer in pure Python."
readme = "README.md"
authors = [
    { name = "Zebraine", email = "zebrainee@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "torch>=2.14.1",
]

[project.scripts]
zebraformer = "zebraformer:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
default = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
